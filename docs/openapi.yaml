openapi: 3.0.3
info:
  title: CERBERUS Commerce OS API
  version: "4.1-production-readiness"
  description: >
    Çekirdek route-handler sözleşmesi. Uçlar varsayılan olarak HttpOnly
    `cerberus_session` JWT çereziyle korunur. Açık uçlar `/api/auth/login`,
    `/api/health` ve `/api/health/ready` olarak security alanında ayrıca işaretlenir.
    Kimliksiz/geçersiz oturum 401, rol veya mağaza kapsamı ihlali 403, body
    doğrulama hatası 422, aşırı gövde 413 ve beklenmeyen sunucu hatası
    correlationId ile 500 döner. STORE_USER için mağaza kapsamı sunucuda zorlanır.
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - { name: auth, description: Kimlik doğrulama ve oturum }
  - { name: orders, description: "Sipariş, import ve export" }
  - { name: intelligence, description: Ürün zekâsı ve karar kasası }
  - { name: batches, description: PSH batch operasyonları }
  - { name: admin, description: Yetkili yönetim işlemleri }
  - { name: system, description: Liveness ve readiness }
  - { name: crawler, description: Mağaza kapsamlı kaynak tarama }
  - { name: keepa, description: Keepa analizi ve cache }
  - { name: analytics, description: Karar destek analitiği }
  - { name: settings, description: Uygulama ayarları }

paths:
  /api/health:
    get:
      tags: [system]
      summary: Canlılık + DB bağlantı kontrolü (hata detayı sızdırmaz)
      security: []
      responses:
        "200": { description: healthy }
        "500": { description: unhealthy (detay yalnızca sunucu logunda) }

  /api/health/ready:
    get:
      tags: [system]
      summary: Trafik kabulü için derin readiness kontrolü
      description: >
        DB erişimi, SESSION_SECRET, beklenen migration sayısı ve head hash'i,
        başlangıç kullanıcı/mağaza kayıtları ile order-product bütünlüğünü denetler.
      security: []
      responses:
        "200": { description: Tüm readiness kontrolleri başarılı }
        "503": { description: En az bir readiness kontrolü başarısız }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Giriş — bcrypt doğrulama, rate-limit (5/15dk), imzalı JWT çerez
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: "success + kullanıcı özeti; Set-Cookie: cerberus_session (HttpOnly, SameSite=Lax, 8 saat)" }
        "401": { description: "E-posta/parola hatalı veya iptal edilmiş parola" }
        "422": { description: "Zod doğrulama hatası" }
        "429": { description: "Rate limit; Retry-After başlığı" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Çerezi siler
      responses: { "200": { description: "success" } }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Mevcut oturum bilgisi
      responses:
        "200": { description: "authenticated + user" }
        "401": { description: "Oturum yok/geçersiz" }

  /api/orders:
    get:
      tags: [orders]
      summary: Sipariş listesi + SQL KPI + sayfalama
      parameters:
        - { name: storeCode, in: query, schema: { type: string } , description: "STORE_USER için yok sayılır (F-11)" }
        - { name: cargoStatus, in: query, schema: { type: string } }
        - { name: pshBatchNo, in: query, schema: { type: string } }
        - { name: search, in: query, description: "Sipariş no, ASIN, MSKU, ürün, marka, tedarikçi ve e-posta içinde arar; ilk 120 karakter kullanılır", schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: "Maskelenmiş orders sayfası, mağaza kapsamlı metadata, filtrelenmiş tüm kümenin kpis değeri ve pagination {page,pageSize,total,pageCount}" }
        "401": { description: Oturum gerekli }
    post:
      tags: [orders]
      summary: Yeni sipariş (40-kolon XLS sözleşmesi; orderCreateSchema)
      responses:
        "200": { description: "message + order" }
        "401": { description: Oturum gerekli }
        "422": { description: Doğrulama hatası }

  /api/orders/export:
    get:
      tags: [orders]
      summary: Filtrelenmiş siparişlerin tamamını CSV stream olarak indir
      description: >
        GET /api/orders ile aynı storeCode, cargoStatus, pshBatchNo ve search
        filtrelerini kullanır. STORE_USER kapsamı ve hassas alan maskelemesi export'ta
        da uygulanır. 250 satırlık parçalarla üretilir; 10.000 satır sessizce kesilmez.
      parameters:
        - { name: storeCode, in: query, schema: { type: string } }
        - { name: cargoStatus, in: query, schema: { type: string } }
        - { name: pshBatchNo, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: UTF-8 BOM içeren 40 kolon CSV stream
          headers:
            X-Export-Row-Count:
              schema: { type: integer }
              description: Export edilen satır sayısı
          content:
            text/csv:
              schema: { type: string, format: binary }
        "401": { description: Oturum gerekli }
        "422": { description: Filtre sonucu 10.000 satırdan fazla; filtreyi daraltın }

  /api/orders/summary:
    get:
      tags: [orders]
      summary: Yalnızca KPI özeti (SQL aggregate; satır dönmez)
      parameters:
        - { name: storeCode, in: query, schema: { type: string } }
      responses:
        "200": { description: "storeScope + kpis" }
        "401": { description: Oturum gerekli }

  /api/orders/{id}:
    patch:
      tags: [orders]
      summary: Sipariş güncelle (beyaz liste alanlar; storeCode kapsam kontrolü)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "message + order" }
        "401": { description: Oturum gerekli }
        "403": { description: Mağaza kapsamı dışı }
        "422": { description: Doğrulama hatası }
    delete:
      tags: [orders]
      summary: Sipariş sil (yalnız ADMIN/MANAGER)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: silindi }
        "401": { description: Oturum gerekli }
        "403": { description: Yetki yetersiz }

  /api/orders/import-xls:
    post:
      tags: [orders]
      summary: Toplu XLS satırı içe aktarım (transaction; 5.000 satır / 15 MB üst sınır)
      responses:
        "200": { description: importedCount }
        "401": { description: Oturum gerekli }
        "413": { description: Gövde çok büyük }
        "422": { description: Doğrulama hatası }

  /api/orders/import-drive-url:
    post:
      tags: [orders]
      summary: Google Drive XLS ayrıştırma (15 sn timeout, 20 MB üst sınır)
      responses:
        "200": { description: "headers + rows" }
        "401": { description: Oturum gerekli }
        "413": { description: Kaynak çok büyük }

  /api/intelligence:
    get:
      tags: [intelligence]
      summary: Product Master vault + araştırmacı skorları + sabah brifingi
      responses:
        "200": { description: "productMasters, researchers, researchSessions ve morningBriefing" }
        "401": { description: Oturum gerekli }
    post:
      tags: [intelligence]
      summary: Yeni Product Master yakalama (Decision Engine hesapları sunucuda)
      responses:
        "200": { description: "message + master" }
        "401": { description: Oturum gerekli }
        "422": { description: Doğrulama hatası }

  /api/intelligence/{id}:
    patch:
      tags: [intelligence]
      summary: Karar aksiyonu güncelle (ADMIN/MANAGER onay matrisi)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "message + master" }
        "401": { description: Oturum gerekli }
        "403": { description: Yetki yetersiz }
        "422": { description: Doğrulama hatası }

  /api/batches:
    get:
      tags: [batches]
      summary: PSH batch listesi (mağaza kapsamlı)
      responses:
        "200": { description: batches }
        "401": { description: Oturum gerekli }
    post:
      tags: [batches]
      summary: Batch oluştur + sipariş bağla
      responses:
        "200": { description: "message + batch" }
        "401": { description: Oturum gerekli }
        "409": { description: Batch numarası/atama yarış çakışması veya sipariş zaten başka batch'te }
        "422": { description: Doğrulama ya da mağaza/batch invariant hatası }

  /api/admin/users:
    get:
      tags: [admin]
      summary: Kullanıcı listesi (ADMIN)
      responses:
        "200": { description: "users (password_hash içermez)" }
        "401": { description: Oturum gerekli }
        "403": { description: Yetki yetersiz }
    post:
      tags: [admin]
      summary: Kullanıcı oluştur (ADMIN; parola bcrypt, min 12 kr.)
      responses:
        "200": { description: "message + user" }
        "422": { description: Doğrulama hatası }
    patch:
      tags: [admin]
      summary: Kullanıcı güncelle (ADMIN)
      responses:
        "200": { description: "message + user" }
        "422": { description: Doğrulama hatası }

  /api/admin/stores:
    get:
      tags: [admin]
      summary: Mağaza listesi + canlı istatistik
      description: STORE_USER yalnız kendi mağazasını; ADMIN/MANAGER tüm mağazaları görür. Hassas kart/e-posta alanları yalnız ADMIN'e açıktır.
      responses:
        "200": { description: Mağaza kapsamlı ve rol bazında maskelenmiş stores }
        "401": { description: Oturum gerekli }
    post:
      tags: [admin]
      summary: Mağaza oluştur (ADMIN/MANAGER)
      responses:
        "200": { description: "message + store" }
        "403": { description: Yetki yetersiz }
        "422": { description: Doğrulama hatası }
    patch:
      tags: [admin]
      summary: Mağaza güncelle (ADMIN/MANAGER)
      responses:
        "200": { description: "message + store" }
        "403": { description: Yetki yetersiz }

  /api/admin/master-crud:
    delete:
      tags: [admin]
      summary: Legacy admin ekranından tek sipariş silme
      description: >
        Generic tablo silme davranışı kaldırılmıştır. Yalnız ADMIN, yalnız `orders`
        ve pozitif tek `id` kabul edilir. Silme ve ORDER_DELETED audit kaydı aynı
        transaction içinde gerçekleşir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, id]
              additionalProperties: false
              properties:
                tableName: { type: string, enum: [orders] }
                id: { type: integer, minimum: 1 }
      responses:
        "200": { description: Sipariş silindi ve denetim izine kaydedildi }
        "401": { description: Oturum gerekli }
        "403": { description: Yalnız ADMIN }
        "404": { description: Sipariş bulunamadı }
        "422": { description: Doğrulama hatası }

  /api/admin/database-reset:
    post:
      tags: [admin]
      summary: "Yıkıcı sıfırlama araçları — yalnız production dışı ortam"
      description: ADMIN ve `RESET-CERBERUS` onayı gerekir; FK sıralı transaction kullanır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionType, confirmationCode]
              additionalProperties: false
              properties:
                actionType:
                  type: string
                  enum: [CLEAN_ORDERS_ONLY, RESTORE_REAL_XLS, FRESH_START_REAL_DATA, NUKE_ALL_KEEP_ADMIN]
                confirmationCode: { type: string, enum: [RESET-CERBERUS] }
      responses:
        "200": { description: İşlem transaction içinde başarılı }
        "401": { description: Oturum gerekli }
        "403": { description: Yalnız ADMIN }
        "404": { description: Production ortamında endpoint kapalı }
        "422": { description: Doğrulama hatası }

  /api/crawler/scrape:
    post:
      tags: [crawler]
      summary: "Tek kaynak URL'i çek — mağaza kapsamlı 6 saat cache, kullanıcı başına 5 istek/dakika"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2000, example: "https://www.vitaminshoppe.com/p/..." }
                storeCode: { type: string, maxLength: 32 }
      responses:
        "200": { description: "jobId, sourceDomain, products[], warnings, cached, fetchedAt, isListingPage" }
        "401": { description: Oturum gerekli }
        "413": { description: Kaynak HTML güvenlik sınırını aşıyor }
        "422": { description: "Sayfadan ürün çıkarılamadı — tek ürün sayfası deneyin" }
        "429": { description: "Kullanıcı başına 5/dakika sınırı; Retry-After: 60" }
        "502": { description: "Site hatası / timeout / bot koruması" }

  /api/crawler/import:
    post:
      tags: [crawler]
      summary: "Seçilen scraped ürünleri kataloğa aktar (products + supplierOffers + lifecycle)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scrapedIds]
              properties:
                scrapedIds: { type: array, items: { type: integer }, minItems: 1, maxItems: 50 }
                storeCode: { type: string, maxLength: 32 }
      responses:
        "200": { description: "imported, results[], warnings" }
        "401": { description: Oturum gerekli }
        "404": { description: Ürün bulunamadı }
        "409": { description: Hepsi zaten aktarıldı }

  /api/keepa/analyze:
    get:
      tags: [keepa]
      summary: "Keepa cache oku (24 saat taze ise DB'den)"
      parameters:
        - { name: asin, in: query, required: true, schema: { type: string, pattern: "^[A-Z0-9]{10}$" } }
        - { name: domain, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200": { description: "cached, isExpired, asin, salesRank, amazonPrice, buyBoxPrice, offerCount, data" }
        "400": { description: Geçersiz ASIN }
    post:
      tags: [keepa]
      summary: "Keepa çek + Decision Engine 2.0 (cache-first, mock fallback, 24s önbellek)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asin]
              properties:
                asin: { type: string, maxLength: 10, example: "B0XXXXXX" }
                domain: { type: integer, default: 1 }
                sourcePrice: { type: number }
                sellingPrice: { type: number }
                sourceDomain: { type: string }
                duplicateScore: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200": { description: "asin, keepa, summary, decision, fromCache, cachedUntil" }
        "401": { description: Oturum gerekli }
        "422": { description: Doğrulama hatası }
        "429": { description: "Keepa kotası doldu — Retry-After" }

  /api/analytics/decision-support:
    get:
      tags: [analytics]
      summary: "Karar Destek Analitik — tek aggregate: KPI + trend + mağaza kıyas + PnL + fırsat + alarm"
      parameters:
        - { name: storeCode, in: query, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d, all], default: 30d } }
      responses:
        "200": { description: "kpis, trend, storeComparison, opportunities, alerts, pnl" }
        "401": { description: Oturum gerekli }

  /api/settings:
    get:
      tags: [settings]
      summary: "Sistem ayarları — ROI eşikleri + Keepa var/yok (anahtar düz metin dönmez)"
      responses:
        "200": { description: "thresholds {rejectRoi, testRoi}, keepa {hasEnvKey, hasDbKey, effectiveHasKey}" }
        "401": { description: Oturum gerekli }
    put:
      tags: [settings]
      summary: "ROI eşiklerini ve Keepa anahtarını güncelle (ADMIN/MANAGER, audit SETTINGS_UPDATE)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectRoi, testRoi]
              properties:
                rejectRoi: { type: number, minimum: 0, maximum: 100, example: 25 }
                testRoi: { type: number, minimum: 0, maximum: 100, example: 38 }
                keepaKey: { type: string, maxLength: 100, description: "Boş string DB'den siler, gönderilmezse değişmez" }
      responses:
        "200": { description: "ok, thresholds, keepaUpdated" }
        "400": { description: "reject >= test veya anahtar çok kısa" }
        "401": { description: Oturum gerekli }
        "403": { description: Yetki yetersiz }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cerberus_session
      description: HttpOnly, imzalı ve süreli JWT oturum çerezi
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        correlationId: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
